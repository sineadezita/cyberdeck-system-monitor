<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberdeck Monitor</title>

    <style>
        /* Base styles */
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 32px;
            margin: 0;
        }

        /* Header */
        h1 {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #64748b;
            margin: 0 0 4px 0;
        }

        #timestamp {
            font-size: 11px;
            color: #334155;
            letter-spacing: 1px;
            margin: 0 0 32px 0;
        }

        /* Metric rows */
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 0.5px solid #1e293b;
        }

        .metric-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #475569;
        }

        /* Progress bar */
        .bar {
            width: 200px;
            height: 2px;
            background: #1e293b;
        }

        .bar-fill {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 0.5s;
        }

        /* Bar colour changes at thresholds */
        .bar-fill.warning { background: #facc15; }
        .bar-fill.danger { background: #f87171; }

        /* Metric value */
        .value {
            font-size: 22px;
            font-weight: 500;
            color: #38bdf8;
            min-width: 60px;
            text-align: right;
        }

        /* Alerts */
        .alert {
            color: #f87171;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 0;
            border-bottom: 0.5px solid #1e293b;
        }

        /* Footer */
        footer {
            margin-top: 32px;
            font-size: 10px;
            color: #1e293b;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyberdeck Monitor</h1>
        <p id="timestamp">Last update: --</p>
    </header>

    <main>

        <!-- Alerts populated by JavaScript when thresholds exceeded -->
        <div id="alerts"></div>

        <!-- CPU -->
        <div class="metric">
            <div class="metric-left">
                <span class="label">CPU</span>
                <div class="bar"><div class="bar-fill" id="cpu-bar"></div></div>
            </div>
            <span class="value" id="cpu">--</span>
        </div>

        <!-- Memory -->
        <div class="metric">
            <div class="metric-left">
                <span class="label">Memory</span>
                <div class="bar"><div class="bar-fill" id="memory-bar"></div></div>
            </div>
            <span class="value" id="memory">--</span>
        </div>

        <!-- Disk -->
        <div class="metric">
            <div class="metric-left">
                <span class="label">Disk</span>
                <div class="bar"><div class="bar-fill" id="disk-bar"></div></div>
            </div>
            <span class="value" id="disk">--</span>
        </div>

    </main>

    <!-- JavaScript added in next commit -->

    <footer>
        <p>cyberdeck monitor v1.0 | auto-refresh every 5s</p>
    </footer>

</body>
</html>
